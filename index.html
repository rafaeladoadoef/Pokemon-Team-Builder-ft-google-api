<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pokémon Dream Team Builder</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-view="pokedex">

  <header class="topbar">
    <div class="brand">
      <span class="pokeball" aria-hidden="true"></span>
      <div>
        <h1>Pokémon Dream Team Builder</h1>
        <p>Monte o time dos sonhos com até 6 Pokémon</p>
      </div>
    </div>
    <div class="topbar-actions">
      <button id="open-saved" class="btn btn-ghost" type="button" data-action="open-saved">📂 Minhas equipes</button>
      <div id="auth-area" class="auth-area"></div>
    </div>
  </header>

  <main class="layout">
    <!-- Painel da Pokédex: busca + resultados -->
    <section id="panel-pokedex" class="panel panel-dex" aria-label="Pokédex">
      <form id="search-form" class="search" role="search">
        <input id="search-input" type="search" autocomplete="off"
               placeholder="Nome ou nº da Pokédex (ex.: pikachu, 25)" aria-label="Buscar Pokémon">
        <button class="btn btn-primary" type="submit">Buscar</button>
      </form>

      <div class="filters">
        <label class="check">
          <input type="checkbox" id="include-forms">
          Incluir formas alternativas (Mega, Gigantamax, regionais…)
        </label>
        <span id="result-count" class="muted"></span>
      </div>
      <p class="hint">💡 Arraste um card até um slot da equipe. Soltar fora dos slots ocupa o primeiro vazio.</p>

      <div id="dex-status" class="status" role="status"></div>
      <div id="dex-grid" class="dex-grid"></div>
      <button id="load-more" class="btn btn-ghost load-more" type="button" data-action="load-more" hidden>Carregar mais</button>
    </section>

    <!-- Painel da equipe -->
    <aside id="panel-team" class="panel panel-team" aria-label="Equipe">
      <div class="team-head">
        <input id="team-name" class="team-name" type="text" maxlength="30" value="Minha equipe" aria-label="Nome da equipe">
        <span id="team-count" class="team-count">0/6</span>
      </div>
      <div id="target-banner" class="banner" hidden></div>
      <div id="team-slots" class="slots"></div>
      <div id="team-summary" class="summary"></div>
      <div class="team-actions">
        <button class="btn btn-primary" type="button" data-action="save-team">💾 Salvar</button>
        <button class="btn btn-ghost" type="button" data-action="new-team">🆕 Nova</button>
        <button class="btn btn-ghost" type="button" data-action="clear-team">🧹 Limpar</button>
      </div>
    </aside>
  </main>

  <!-- Navegação inferior (aparece só no mobile) -->
  <nav class="bottom-nav" aria-label="Navegação principal">
    <button type="button" class="active" data-action="set-view" data-view="pokedex">🔎 Pokédex</button>
    <button type="button" data-action="set-view" data-view="team">⚔️ Equipe <span id="nav-count" class="pill">0</span></button>
    <button type="button" data-action="open-saved">📂 Salvas</button>
  </nav>

  <dialog id="detail-dialog" class="dialog"><div id="detail-content"></div></dialog>

  <dialog id="saved-dialog" class="dialog dialog-sm">
    <div class="detail">
      <button class="dialog-close" type="button" data-action="close-dialog" aria-label="Fechar">✕</button>
      <h2>Minhas equipes</h2>
      <div id="saved-content"></div>
    </div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- Scripts clássicos: a ordem importa -->
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/repository.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/app.js"></script>
  <!-- Único módulo ES: carrega o Firebase e avisa o app quando estiver pronto -->
  <script type="module" src="js/firebase-service.js"></script>
</body>
</html>
